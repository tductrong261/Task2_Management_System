<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Management System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="auth-page"><main class="auth-layout"><a class="auth-logo" href="index.html" aria-label="Back to landing page">M</a><h1>Welcome Back!</h1><p class="auth-intro">Sign in to continue to your account.</p><section class="auth-card"><h2>Login to your account</h2><p>Enter your email and password to get started.</p><div id="loginMessage" class="alert alert-danger d-none" role="alert"></div><form id="loginForm" novalidate><div class="mb-3"><label class="form-label" for="email">Email Address</label><input type="email" class="form-control" id="email" placeholder="Enter your email" autocomplete="email" required></div><div class="mb-3"><div class="d-flex justify-content-between"><label class="form-label" for="password">Password</label><a class="small auth-link" href="forgot.html">Forgot password?</a></div><div class="password-wrap"><input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required><button id="togglePassword" type="button" class="show-button">Show</button></div></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><button class="btn sign-in-btn w-100" type="submit">Sign In</button></form><p class="auth-bottom">Don't have an account? <a href="register.html">Create an account</a></p></section><small class="auth-copyright">&copy; 2026 My Website. All rights reserved.</small></main><script src="assets/js/auth.js"></script></body></html>
