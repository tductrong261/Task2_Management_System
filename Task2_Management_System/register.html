<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Management System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body class="auth-page"><main class="auth-layout"><a class="auth-logo" href="index.html">M</a><h1>Create Account</h1><p class="auth-intro">Join our learning platform.</p><section class="auth-card"><h2>Sign up</h2><p>All fields are required.</p><div id="registerMessage" class="alert alert-danger d-none" role="alert"></div><form id="registerForm" novalidate><div class="mb-3"><label class="form-label" for="name">Full Name</label><input class="form-control" id="name" autocomplete="name" required placeholder="Your full name"></div><div class="mb-3"><label class="form-label" for="email">Email Address</label><input type="email" class="form-control" id="email" required autocomplete="email" placeholder="Enter your email"></div><div class="mb-4"><label class="form-label" for="password">Password (at least 6 characters)</label><input type="password" class="form-control" id="password" autocomplete="new-password" required placeholder="Create a password"></div><button class="btn sign-in-btn w-100">Create Account</button></form><p class="auth-bottom">Already have an account? <a href="login.html">Sign in</a></p></section><small class="auth-copyright">Demo only — no server-side user accounts.</small></main><script src="assets/js/auth.js"></script></body></html>
